# 6soft HRM — security headers snippet.
# Copied to /etc/nginx/snippets/ by scripts/deploy-vps.sh
#
# Activate by adding this line inside each `server { ... }` block on the VPS
# (both the :80 and the Certbot-generated :443 block):
#
#   include /etc/nginx/snippets/6soft-security-headers.conf;
#
# Then: nginx -t && systemctl reload nginx

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-XSS-Protection "0" always;

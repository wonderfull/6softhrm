# OnsideHR — security headers snippet.
# Copied to /etc/nginx/snippets/ by scripts/deploy-vps.sh
# (filename kept as 6soft-* because deploy-vps.sh installs it by that path).
#
# Activate by adding this line inside each `server { ... }` block on the VPS
# (both the :80 and the Certbot-generated :443 block):
#
#   include /etc/nginx/snippets/6soft-security-headers.conf;
#
# Then: nginx -t && systemctl reload nginx
#
# IMPORTANT — nginx add_header inheritance: a `location` that sets ANY
# add_header of its own DISCARDS the entire inherited set. Any location with
# its own Cache-Control (the SPA `location /`, the static-asset regex block)
# must therefore include this snippet again, or it will serve index.html with
# no CSP at all. nginx.conf in the repo root shows the pattern.
#
# Nginx serves the built SPA from disk, so THIS is the layer whose CSP
# protects the app document. Express sets its own, stricter, CSP on /api
# responses (backend/src/app.ts); it serves no HTML.

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()" always;

# Content Security Policy — derived from the actual Vite build output and
# verified in a browser against frontend/dist. Rationale per directive:
#   script-src 'self'            Vite emits one external module script and no
#                                inline scripts; the bundle contains no eval
#                                and no WebAssembly. No 'unsafe-inline' needed.
#   script-src-attr 'none'       nothing uses inline event handler attributes.
#   style-src (no unsafe-inline) Tailwind compiles to a static stylesheet, and
#                                React writes style props through CSSOM, which
#                                CSP does not police. Verified: the app renders
#                                clean without 'unsafe-inline'.
#   fonts.googleapis/gstatic     frontend/index.html loads Inter from Google
#                                Fonts (stylesheet + font files).
#   img-src ... https:           tenants set an arbitrary logoUrl rendered in
#                                NavBar; data: covers the 2FA QR code, blob:
#                                the document image preview.
#   frame-src 'self' blob:       Documents.tsx previews PDFs in an iframe whose
#                                src is a blob: URL. Omitting this silently
#                                breaks document preview.
#   connect-src 'self'           the API is same-origin behind /api/. If you
#                                point VITE_API_URL at another host, that
#                                origin MUST be added here.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; frame-src 'self' blob:; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;

add_header X-XSS-Protection "0" always;

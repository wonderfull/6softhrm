name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check deployment secrets
        run: |
          test -n "${{ secrets.VPS_HOST }}" || (echo "Missing VPS_HOST secret" && exit 1)
          test -n "${{ secrets.VPS_USER }}" || (echo "Missing VPS_USER secret" && exit 1)
          test -n "${{ secrets.VPS_SSH_KEY }}" || (echo "Missing VPS_SSH_KEY secret" && exit 1)

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          # These two lines run from this file, not from the copy of the deploy
          # script on the server — which matters, because the script cannot fix
          # its own inability to be pulled. `npm install` used to rewrite the
          # lockfiles in place, and those writes then blocked `git pull`, so a
          # deploy that changed a dependency locked the server out of the next
          # one. The script now uses `npm ci` and no longer causes it, but the
          # server only receives that fix once a pull succeeds.
          script: |
            cd /var/www/6softhrm
            git checkout -- backend/package-lock.json frontend/package-lock.json 2>/dev/null || true
            DEPLOY_MAIN_SITE=0 bash /var/www/6softhrm/scripts/deploy-vps.sh

name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run tests
        working-directory: frontend
        run: npm run test # vitest auto-detects CI=true (set by the runner) and runs once instead of watching

  backend-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Compile TypeScript
        working-directory: backend
        run: npm run build

  # Backend Jest tests need a real MySQL database (see
  # backend/src/__tests__/setup.ts: it runs `prisma db push` against
  # TEST_DATABASE_URL, then creates a per-suite tenant). That turned out to
  # be a small, self-contained job — no seed data, no external secrets,
  # just an ephemeral MySQL service container — so it's wired in here
  # rather than left as a TODO:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: onsidehr_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/onsidehr_test
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/onsidehr_test
      JWT_SECRET: ci-test-secret-key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: Run tests
        working-directory: backend
        run: npm test

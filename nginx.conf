# Nginx Configuration for 6soft HRM
# Replace 'hrm.yourdomain.com' with your actual subdomain
#
# Apply on the VPS:
#   sudo cp nginx.conf /etc/nginx/sites-available/hrm.6soft.co.uk
#   sudo sed -i 's|hrm.yourdomain.com|hrm.6soft.co.uk|g' \
#     /etc/nginx/sites-available/hrm.6soft.co.uk
#   sudo nginx -t && sudo systemctl reload nginx

# Hide nginx version banner — must live in http{} (set in /etc/nginx/nginx.conf):
#   server_tokens off;
# It's repeated here as a reminder; nginx ignores it inside server{} but the
# deploy script enforces the http-level setting.

server {
    listen 80;
    listen [::]:80;
    server_name hrm.yourdomain.com;

    root /var/www/hrm.yourdomain.com;
    index index.html;

    # --- Security headers ---
    # Nginx, not Express, serves index.html, so this is the layer that carries
    # the CSP protecting the SPA. See docs/ops-runbook.md § XSS / token storage.
    #
    # NOTE: nginx add_header does NOT inherit into a location that has an
    # add_header of its own — it replaces the whole inherited set. Every
    # location below that sets Cache-Control therefore repeats this block, or
    # it would silently serve index.html with no CSP at all.
    #
    # HSTS — force HTTPS for 2 years incl. subdomains. preload only when ready.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # Clickjacking — admin console must never be framed.
    add_header X-Frame-Options "DENY" always;
    # MIME sniffing protection.
    add_header X-Content-Type-Options "nosniff" always;
    # Referrer hygiene — don't leak full URLs cross-origin.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Lock down powerful browser APIs we don't use.
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()" always;
    # Content Security Policy — verified against the Vite build, see the
    # directive-by-directive rationale in docs/ops-runbook.md.
    #   script-src 'self'          Vite emits one external module, zero inline
    #                              scripts, no eval — so no 'unsafe-inline'.
    #   style-src  (no unsafe-inline) Tailwind compiles to a static stylesheet
    #                              and React writes style props through CSSOM,
    #                              which CSP does not police. Verified in a
    #                              browser: the app renders clean without it.
    #   img-src ... https:         tenants set an arbitrary logoUrl (NavBar);
    #                              blob:/data: cover document + QR previews.
    #   frame-src 'self' blob:     Documents.tsx previews PDFs in an iframe
    #                              pointed at a blob: URL. Without this the
    #                              preview silently breaks.
    #   connect-src 'self'         API is same-origin via /api/ below. If you
    #                              ever set VITE_API_URL to another host, add
    #                              that origin here or every request fails.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; frame-src 'self' blob:; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;
    # Legacy header — modern browsers ignore but no harm.
    add_header X-XSS-Protection "0" always;

    # crawler files served from disk (set Content-Type explicitly)
    location = /robots.txt  { try_files $uri =404; access_log off; default_type text/plain; }
    location = /sitemap.xml { try_files $uri =404; access_log off; default_type application/xml; }

    # Frontend - serve static files
    location / {
        try_files $uri $uri/ /index.html;
        # Repeated because the Cache-Control add_header below drops the
        # server-level set — this is the location that serves index.html.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; frame-src 'self' blob:; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;
        add_header X-XSS-Protection "0" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Backend API - proxy to Node.js
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # File uploads endpoint
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Static assets caching. Regex locations win over the `location /` prefix,
    # so this is what serves /assets/*.js and *.css — and its Cache-Control
    # add_header drops the server-level security headers, hence the repeat.
    # nosniff matters most here; the CSP matters for a directly-opened .svg.
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; frame-src 'self' blob:; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;
        add_header X-XSS-Protection "0" always;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        application/xml
        image/svg+xml;

    # Logs
    access_log /var/log/nginx/hrm.yourdomain.com.access.log;
    error_log /var/log/nginx/hrm.yourdomain.com.error.log;

    # Client max body size (for file uploads - 10MB)
    client_max_body_size 10M;

    # Buffer sizes
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
}

# HTTPS configuration will be added automatically by Certbot
# After running: certbot --nginx -d hrm.yourdomain.com
